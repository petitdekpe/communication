# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

# Routes publiques : toutes sous /fr ou /en. Chaque contrôleur déclare son chemin traduit
# (ex. ['fr' => '/actualites/{slug}', 'en' => '/news/{slug}']) ; _locale est fixé par le préfixe.
# Seuls les contrôleurs du site public (src/Controller) sont préfixés par la langue ; l'administration
# (src/Admin/Controller) est routée sans préfixe par config/routes/admin.yaml.
controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute
    prefix:
        fr: '/fr'
        en: '/en'
    trailing_slash_on_root: false

# La racine redirige vers la langue par défaut : toutes les URL publiques sont préfixées (/fr, /en).
app_root:
    path: /
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
    defaults:
        route: app_home
        permanent: false
        _locale: '%kernel.default_locale%'

# Sitemap XML (toutes langues, alternates hreflang), à la racine.
app_sitemap_xml:
    path: /sitemap.xml
    controller: App\Controller\SitemapController::xml
    methods: [GET]
    defaults:
        _cacheable: true
        _locale: '%kernel.default_locale%'

# Pages éditoriales : /{langue}/{chemin dans l'arborescence}. Déclarée en dernier, après toutes les routes
# explicites (les contrôleurs de src/Controller et l'administration), qui l'emportent donc toujours.
# Le chemin est résolu par App\Page\PageTree ; un chemin inconnu répond 404.
app_page_show:
    path: /{_locale}/{path}
    controller: App\Controller\PageController::show
    methods: [GET]
    requirements:
        _locale: 'fr|en'
        path: '.+'
    defaults:
        _cacheable: true
